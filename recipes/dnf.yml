modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - terra.repo
        - playit-fedora.repo
        - tailscale.repo
      copr:
        - atim/starship
        - avengemedia/dms # Niri
        - faugus/faugus-launcher
        - tofik/sway # nwg-look
        - tofik/nwg-shell # nwg-look
        - alternateved/keyd
        - scottames/awww
        - mineiro/satty
    install:
      exclude:
        - alacritty
      packages:
        # Terminal stuff
        - tree-sitter-cli
        - starship
        - fish
        - unzip
        - tmux
        - trash-cli
        - ripgrep
        - fd-find
        - fzf
        - bat
        - eza
        - zoxide
        - lazygit
        - diff-so-fancy
        # WMs
        - niri
        - mangowm
        - noctalia
        - fuzzel
        - grim
        - slurp
        - satty
        - awww
        # Thunar stuff
        - thunar
        - thunar-archive-plugin
        - thunar-media-tags-plugin
        - thunar-volman
        - gvfs
        - tumbler
        - ffmpegthumbnailer
        - xarchiver
        # Random?
        - qalculate
        - ghostty
        - kitty
        - faugus-launcher
        - nwg-look
        - keyd
        - qt6ct
        - kvantum
        - xdg-desktop-portal-wlr
        - tailscale
        - playit
        - lact
        - heroic
        - sshfs
        - gnome-initial-setup
        # Setup virtualization with ujust setup-virtualization
    remove:
      packages:
        - waydroid
        - waydroid-selinux
        - input-remapper

  - type: script
    scripts:
      - install-bob.sh
      - install-cloudflared.sh
      - rename-os.sh
      - cleanup-waydroid.sh

  - type: systemd
    system:
      enabled:
        - keyd
        - tailscaled
        - playit
        - lactd

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
